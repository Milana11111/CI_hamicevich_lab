name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r quality-audit-service/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 quality-audit-service --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 quality-audit-service --count --max-line-length=100 --statistics --exit-zero

      - name: Build Docker Image
        run: docker build -t quality-audit-service:test ./quality-audit-service